spring.application.name=bank-transaction-app

# Active profile: set to 'h2' for local in-memory DB or 'postgres' for PostgreSQL
spring.profiles.active=h2

# ---------- Default Datasource (H2 in-memory) ----------
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- H2 Web Console ----------
# Accessible at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:bankdb, User Name: sa, Password: (leave blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Server ----------
server.port=8080

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
